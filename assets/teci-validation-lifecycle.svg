<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">TECI Validation Lifecycle</title>
  <desc id="desc">A lifecycle diagram for validating TECI. The flow moves through real flows, H.U.M.A.N. modeling, manual scoring, blind expert review, accessibility findings, user friction over time, domain tuning, and published risk cases.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="44%" stop-color="#0d2b35"/>
      <stop offset="100%" stop-color="#23143c"/>
    </linearGradient>

    <radialGradient id="auroraA" cx="28%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraB" cx="74%" cy="74%" r="74%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerFill" cx="50%" cy="42%" r="64%">
      <stop offset="0%" stop-color="#102a3b"/>
      <stop offset="64%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>

    <linearGradient id="orbit" x1="210" y1="190" x2="1590" y2="1110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="30%" stop-color="#5eead4"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>

    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>

    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="card5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>

    <linearGradient id="card6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.30"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.26"/>
    </filter>

    <marker id="arrow" markerWidth="17" markerHeight="17" refX="13" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 13 6 L 1 11 Z" fill="#76f7e4"/>
    </marker>

    <style>
      .sans {
        font-family: Arial, Helvetica, sans-serif;
      }

      .eyebrow {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1.6px;
        fill: #9af7df;
      }

      .hero {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 58px;
        font-weight: 800;
        letter-spacing: 0;
        fill: #f8fafc;
      }

      .subtitle {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 22px;
        font-weight: 600;
        fill: #dbeafe;
      }

      .card-title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0;
        fill: #101827;
      }

      .card-body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0;
        fill: #334155;
      }

      .center-title {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 31px;
        font-weight: 800;
        fill: #f8fafc;
      }

      .center-body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #dbeafe;
      }

      .number {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 900;
        fill: #ffffff;
      }

      .connector {
        fill: none;
        stroke: #76f7e4;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-opacity: 0.88;
        marker-end: url(#arrow);
      }

      .soft-ring {
        fill: none;
        stroke: #e0f2fe;
        stroke-width: 2;
        stroke-dasharray: 9 13;
        stroke-linecap: round;
        stroke-opacity: 0.22;
      }
    </style>
  </defs>

  <rect width="1800" height="1300" fill="url(#bg)"/>
  <rect width="1800" height="1300" fill="url(#auroraA)"/>
  <rect width="1800" height="1300" fill="url(#auroraB)"/>
  <circle cx="900" cy="655" r="470" fill="#0f172a" opacity="0.42"/>
  <circle cx="900" cy="655" r="360" fill="#0f172a" opacity="0.36"/>

  <text x="100" y="92" class="eyebrow">H.U.M.A.N. PROTOCOL</text>
  <text x="100" y="154" class="hero">TECI Validation Lifecycle</text>
  <text x="102" y="196" class="subtitle">A practical loop for testing whether temporal UX claims survive contact with real evidence.</text>

  <g transform="translate(1235 78)" filter="url(#shadow)">
    <rect width="455" height="96" rx="22" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="48" cy="48" r="24" fill="#134e4a"/>
    <circle cx="48" cy="48" r="13" fill="#5eead4"/>
    <text x="88" y="42" class="sans" font-size="18" font-weight="800" fill="#f8fafc">Legitimacy test</text>
    <text x="88" y="70" class="sans" font-size="16" font-weight="650" fill="#cbd5e1">Do surfaced risks match what humans find?</text>
  </g>

  <path d="M 250 645 C 286 296, 562 140, 900 140 C 1238 140, 1514 296, 1550 645 C 1514 994, 1238 1150, 900 1150 C 562 1150, 286 994, 250 645 Z" class="soft-ring"/>
  <path d="M 330 645 C 354 364, 590 245, 900 245 C 1210 245, 1446 364, 1470 645 C 1446 926, 1210 1045, 900 1045 C 590 1045, 354 926, 330 645 Z" fill="none" stroke="url(#orbit)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.92"/>

  <path d="M 500 317 C 570 260, 642 246, 715 272" class="connector"/>
  <path d="M 1085 272 C 1160 246, 1231 260, 1300 317" class="connector"/>
  <path d="M 1475 410 C 1530 482, 1532 548, 1480 585" class="connector"/>
  <path d="M 1480 715 C 1532 782, 1530 848, 1475 895" class="connector"/>
  <path d="M 1300 980 C 1232 1042, 1162 1060, 1085 1028" class="connector"/>
  <path d="M 715 1028 C 638 1060, 568 1042, 500 980" class="connector"/>
  <path d="M 325 895 C 270 832, 268 760, 320 715" class="connector"/>
  <path d="M 320 585 C 268 522, 270 455, 325 410" class="connector"/>

  <g transform="translate(650 438)" filter="url(#shadow)">
    <circle cx="250" cy="215" r="205" fill="url(#centerFill)" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="250" cy="215" r="164" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.66"/>
    <circle cx="250" cy="215" r="104" fill="#020617" opacity="0.28"/>
    <text x="250" y="142" text-anchor="middle" class="center-title">The Legitimation Loop</text>
    <text x="250" y="190" text-anchor="middle" class="center-body">TECI is not validated</text>
    <text x="250" y="220" text-anchor="middle" class="center-body">by a score.</text>
    <text x="250" y="266" text-anchor="middle" class="center-body">It becomes useful when</text>
    <text x="250" y="296" text-anchor="middle" class="center-body">it exposes verifiable risks.</text>
    <line x1="76" y1="326" x2="424" y2="326" stroke="#67e8f9" stroke-width="2" stroke-opacity="0.62"/>
    <text x="250" y="362" text-anchor="middle" class="sans" font-size="19" font-weight="800" fill="#9af7df">Score less. Investigate more.</text>
  </g>

  <g transform="translate(92 250)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card1)" stroke="#5eead4" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#0f766e"/>
    <text x="50" y="61" text-anchor="middle" class="number">1</text>
    <text x="92" y="50" class="card-title">Choose real flows</text>
    <text x="92" y="84" class="card-body">Use production or realistic</text>
    <text x="92" y="110" class="card-body">flows, not only idealized</text>
    <text x="92" y="136" class="card-body">examples.</text>
  </g>

  <g transform="translate(685 232)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card2)" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#b45309"/>
    <text x="50" y="61" text-anchor="middle" class="number">2</text>
    <text x="92" y="50" class="card-title">Model obligations</text>
    <text x="92" y="84" class="card-body">Map phases, required</text>
    <text x="92" y="110" class="card-body">evidence, risks, agency,</text>
    <text x="92" y="136" class="card-body">and recovery paths.</text>
  </g>

  <g transform="translate(1278 250)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card3)" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#6d28d9"/>
    <text x="50" y="61" text-anchor="middle" class="number">3</text>
    <text x="92" y="50" class="card-title">Score manually</text>
    <text x="92" y="84" class="card-body">Record confidence,</text>
    <text x="92" y="110" class="card-body">evidence age, severity,</text>
    <text x="92" y="136" class="card-body">and missing signals.</text>
  </g>

  <g transform="translate(1278 548)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card4)" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#0369a1"/>
    <text x="50" y="61" text-anchor="middle" class="number">4</text>
    <text x="92" y="50" class="card-title">Blind expert review</text>
    <text x="92" y="84" class="card-body">Compare against UX</text>
    <text x="92" y="110" class="card-body">severity, phase findings,</text>
    <text x="92" y="136" class="card-body">and missed risks.</text>
  </g>

  <g transform="translate(1278 846)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card5)" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#047857"/>
    <text x="50" y="61" text-anchor="middle" class="number">5</text>
    <text x="92" y="50" class="card-title">Accessibility findings</text>
    <text x="92" y="84" class="card-body">Map keyboard, screen</text>
    <text x="92" y="110" class="card-body">reader, focus, errors,</text>
    <text x="92" y="136" class="card-body">zoom, motion, recovery.</text>
  </g>

  <g transform="translate(685 894)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card6)" stroke="#fb7185" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#be123c"/>
    <text x="50" y="61" text-anchor="middle" class="number">6</text>
    <text x="92" y="50" class="card-title">User friction over time</text>
    <text x="92" y="84" class="card-body">Compare support tickets,</text>
    <text x="92" y="110" class="card-body">abandonment, retries,</text>
    <text x="92" y="136" class="card-body">incidents, interviews.</text>
  </g>

  <g transform="translate(92 846)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card2)" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#b45309"/>
    <text x="50" y="61" text-anchor="middle" class="number">7</text>
    <text x="92" y="50" class="card-title">Tune by domain</text>
    <text x="92" y="84" class="card-body">Adjust weights and</text>
    <text x="92" y="110" class="card-body">half-lives against</text>
    <text x="92" y="136" class="card-body">observed consequences.</text>
  </g>

  <g transform="translate(92 548)" filter="url(#cardShadow)">
    <rect width="430" height="178" rx="24" fill="url(#card3)" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="50" cy="52" r="26" fill="#6d28d9"/>
    <text x="50" y="61" text-anchor="middle" class="number">8</text>
    <text x="92" y="50" class="card-title">Publish risk cases</text>
    <text x="92" y="84" class="card-body">Show what TECI caught,</text>
    <text x="92" y="110" class="card-body">missed, changed, and</text>
    <text x="92" y="136" class="card-body">still cannot prove.</text>
  </g>

  <g transform="translate(170 1152)" filter="url(#shadow)">
    <rect width="1460" height="96" rx="26" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="38" y="37" class="sans" font-size="15" font-weight="800" letter-spacing="1px" fill="#facc15">TIME WINDOW SCORED ACROSS EVERY FLOW</text>
    <g transform="translate(38 54)">
      <rect x="0" y="0" width="218" height="28" rx="14" fill="#2dd4bf"/>
      <rect x="238" y="0" width="218" height="28" rx="14" fill="#fbbf24"/>
      <rect x="476" y="0" width="218" height="28" rx="14" fill="#a78bfa"/>
      <rect x="714" y="0" width="218" height="28" rx="14" fill="#fb7185"/>
      <rect x="952" y="0" width="218" height="28" rx="14" fill="#7dd3fc"/>
      <rect x="1190" y="0" width="194" height="28" rx="14" fill="#86efac"/>
      <text x="109" y="19" text-anchor="middle" class="sans" font-size="13" font-weight="900" fill="#07111f">BEFORE</text>
      <text x="347" y="19" text-anchor="middle" class="sans" font-size="13" font-weight="900" fill="#07111f">DURING</text>
      <text x="585" y="19" text-anchor="middle" class="sans" font-size="13" font-weight="900" fill="#07111f">AFTER</text>
      <text x="823" y="19" text-anchor="middle" class="sans" font-size="13" font-weight="900" fill="#07111f">INTERRUPTION</text>
      <text x="1061" y="19" text-anchor="middle" class="sans" font-size="13" font-weight="900" fill="#07111f">RECOVERY</text>
      <text x="1287" y="19" text-anchor="middle" class="sans" font-size="13" font-weight="900" fill="#07111f">REPEAT USE</text>
    </g>
  </g>
</svg>
